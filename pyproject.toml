[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-aware-runtime"
version = "0.1.0"
description = "State-Aware Durable Runtime for Reliable Long-Horizon AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nishita Singh"},
]
keywords = ["ai-agents", "durable-runtime", "long-horizon", "state-management", "behavioral-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24.0",
]
server = [
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "minio>=7.1.0",
    "prometheus-client>=0.17.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.scripts]
sadr = "state_aware_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*:UserWarning",
    "ignore:.*starlette.*:Warning",
]
